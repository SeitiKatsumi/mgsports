services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meuolympikus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d meuolympikus"], interval: 5s, timeout: 5s, retries: 10}
  app:
    build: .
    restart: unless-stopped
    ports: ["80:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-local-change-me}@postgres:5432/meuolympikus
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-at-least-32-characters}
    depends_on: {postgres: {condition: service_healthy}}
volumes: {postgres_data: {}}
