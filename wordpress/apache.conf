ServerTokens Prod
ServerSignature Off
<Directory /var/www/html/conteudo>
    Options -Indexes
    <FilesMatch "^(wp-config\.php|xmlrpc\.php|readme\.html|license\.txt)$">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /var/www/html/conteudo/wp-content/uploads>
    <FilesMatch "(?i:\.(php[0-9]?|phtml|phar)$)">
        Require all denied
    </FilesMatch>
</Directory>
